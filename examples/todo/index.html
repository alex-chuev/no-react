<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoReact Todo</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input[type=text] { flex: 1; padding: .4rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
    li.done span { text-decoration: line-through; opacity: .5; }
    li button { margin-left: auto; }
    footer { display: flex; gap: .5rem; align-items: center; color: #666; }
    footer button[aria-pressed=true] { font-weight: bold; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="build/main.js"></script>
</body>
</html>
